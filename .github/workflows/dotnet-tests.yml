name: .NET Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install FFmpeg
        shell: powershell
        run: choco install ffmpeg -y

      - name: Restore
        run: dotnet restore Qplayer.sln

      - name: Build
        run: dotnet build Qplayer.sln --configuration Release --no-restore

      - name: Start screen recording
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\artifacts" | Out-Null

          $process = Start-Process ffmpeg `
            -ArgumentList @(
              "-y",
              "-f", "gdigrab",
              "-framerate", "10",
              "-i", "desktop",
              "-c:v", "libx264",
              "-preset", "ultrafast",
              "-pix_fmt", "yuv420p",
              "$env:GITHUB_WORKSPACE\artifacts\test-feed.mp4"
            ) `
            -PassThru `
            -WindowStyle Hidden

          $process.Id | Set-Content "$env:GITHUB_WORKSPACE\ffmpeg.pid"

      - name: Run tests
        run: dotnet test Qplayer.Tests/Qplayer.Tests.csproj --configuration Release

      - name: Stop screen recording
        if: always()
        shell: powershell
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE\ffmpeg.pid") {
            $ffmpegPid = Get-Content "$env:GITHUB_WORKSPACE\ffmpeg.pid"

            $process = Get-Process -Id $ffmpegPid -ErrorAction SilentlyContinue

            if ($process) {
              $process.CloseMainWindow()
              $process.WaitForExit(10000)
            }

            if (Get-Process -Id $ffmpegPid -ErrorAction SilentlyContinue) {
              Stop-Process -Id $ffmpegPid -Force
            }
          }

      - name: Upload test recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qplayer-test-feed
          path: artifacts/test-feed.mp4
          if-no-files-found: warn