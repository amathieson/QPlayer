name: .NET Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install FFmpeg
        shell: powershell
        run: choco install ffmpeg -y

      - name: Restore
        run: dotnet restore Qplayer.sln

      - name: Build
        run: dotnet build Qplayer.sln --configuration Debug --no-restore

      - name: Set display resolution
        shell: powershell
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force

          Get-CimInstance Win32_VideoController |
            Select-Object CurrentHorizontalResolution, CurrentVerticalResolution

      - name: Prepare recording
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Set-Content artifacts/current-test.txt "Starting tests..."

      - name: Run tests with recording
        shell: powershell
        run: |
          $recording = "$env:GITHUB_WORKSPACE\artifacts\test-feed.mkv"
          $testLabel = "$env:GITHUB_WORKSPACE\artifacts\current-test.txt"
          $testLog = "$env:GITHUB_WORKSPACE\artifacts\test-output.log"

          $ffmpeg = New-Object System.Diagnostics.Process
          $ffmpeg.StartInfo = New-Object System.Diagnostics.ProcessStartInfo

          $ffmpeg.StartInfo.FileName = "ffmpeg"
          $ffmpeg.StartInfo.WorkingDirectory = "$env:GITHUB_WORKSPACE\artifacts"

          $filter = "drawtext=textfile='current-test.txt':reload=1:fontcolor=white:fontsize=28:box=1:boxcolor=black@0.65:boxborderw=12:x=20:y=h-th-20"

          $ffmpeg.StartInfo.Arguments = @(
            "-y",
            "-f", "gdigrab",
            "-framerate", "10",
            "-video_size", "1920x1080",
            "-i", "desktop",
            "-vf", $filter,
            "-c:v", "libx264",
            "-preset", "ultrafast",
            "-pix_fmt", "yuv420p",
            $recording
          ) -join " "

          $ffmpeg.StartInfo.UseShellExecute = $false
          $ffmpeg.StartInfo.CreateNoWindow = $true
          $ffmpeg.StartInfo.RedirectStandardInput = $true

          $ffmpeg.Start()

          Write-Host "FFmpeg recording started (PID $($ffmpeg.Id))"
          try {
            dotnet test Qplayer.Tests/Qplayer.Tests.csproj `
              --configuration Debug `
              --no-build `
              --logger "console;verbosity=normal" 2>&1 |
              ForEach-Object {
                $line = $_

                # Keep the normal output in the GitHub Actions log
                Write-Host $line

                # TODO: tailor this regex to the test framework's output
                if ($line -match '\]\s+(.*?)\s+\[STARTED\]') {
                  Set-Content $testLabel $Matches[1]
                }

                Add-Content $testLog $line
              }

            $testExitCode = $LASTEXITCODE
          }
          finally {
            Set-Content $testLabel "Tests complete"

            Write-Host "Stopping FFmpeg..."

            if (!$ffmpeg.HasExited) {
              $ffmpeg.StandardInput.WriteLine("q")
              $ffmpeg.StandardInput.Flush()

              if (!$ffmpeg.WaitForExit(15000)) {
                Write-Warning "FFmpeg did not exit cleanly; terminating it."
                $ffmpeg.Kill()
                $ffmpeg.WaitForExit()
              }
            }

            Write-Host "FFmpeg exited with code $($ffmpeg.ExitCode)"
          }

          exit $testExitCode

      - name: Convert recording to MP4
        if: always()
        shell: powershell
        run: |
          $input = "$env:GITHUB_WORKSPACE\artifacts\test-feed.mkv"
          $output = "$env:GITHUB_WORKSPACE\artifacts\test-feed.mp4"

          if (Test-Path $input) {
            ffmpeg -y -i "$input" -c copy "$output"
          }

      - name: Upload test recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-recording
          path: artifacts/test-feed.mp4