name: .NET Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install FFmpeg
        shell: powershell
        run: choco install ffmpeg -y

      - name: Restore
        run: dotnet restore Qplayer.sln

      - name: Build
        run: dotnet build Qplayer.sln --configuration Debug --no-restore

      - name: Start screen recording
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\artifacts" | Out-Null

          $ffmpegLog = "$env:GITHUB_WORKSPACE\artifacts\ffmpeg.log"
          $ffmpegOutput = "$env:GITHUB_WORKSPACE\artifacts\test-feed.mp4"

          $process = Start-Process ffmpeg `
            -ArgumentList @(
              "-y",
              "-f", "gdigrab",
              "-framerate", "10",
              "-draw_mouse", "1",
              "-i", "desktop",
              "-c:v", "libx264",
              "-preset", "ultrafast",
              "-pix_fmt", "yuv420p",
              $ffmpegOutput
            ) `
            -RedirectStandardError $ffmpegLog `
            -PassThru `
            -WindowStyle Hidden

          $process.Id | Set-Content "$env:GITHUB_WORKSPACE\ffmpeg.pid"

          Start-Sleep -Seconds 3

          if ($process.HasExited) {
            Write-Host "FFmpeg exited early with code $($process.ExitCode)"
            Get-Content $ffmpegLog
            exit 1
          }

          Write-Host "FFmpeg recording started (PID $($process.Id))"

      - name: Run tests
        run: dotnet test Qplayer.Tests/Qplayer.Tests.csproj --configuration Debug --no-build

      - name: Stop screen recording
        if: always()
        shell: powershell
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE\ffmpeg.pid") {
            $ffmpegPid = Get-Content "$env:GITHUB_WORKSPACE\ffmpeg.pid"

            $process = Get-Process -Id $ffmpegPid -ErrorAction SilentlyContinue

            if ($process) {
              Write-Host "Stopping FFmpeg..."

              # Ask FFmpeg to terminate gracefully.
              $process.CloseMainWindow()
              $process.WaitForExit(10000)
            }

            if (Get-Process -Id $ffmpegPid -ErrorAction SilentlyContinue) {
              Write-Host "FFmpeg did not exit gracefully, killing it."
              Stop-Process -Id $ffmpegPid -Force
            }
          }

          if (Test-Path "$env:GITHUB_WORKSPACE\artifacts\ffmpeg.log") {
            Write-Host "===== FFmpeg log ====="
            Get-Content "$env:GITHUB_WORKSPACE\artifacts\ffmpeg.log"
          }

      - name: Upload test recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qplayer-test-feed
          path: | 
            artifacts/test-feed.mp4
            artifacts/ffmpeg.log
          if-no-files-found: warn