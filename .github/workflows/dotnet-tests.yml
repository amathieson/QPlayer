name: .NET Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install FFmpeg
        shell: powershell
        run: choco install ffmpeg -y

      - name: Restore
        run: dotnet restore Qplayer.sln

      - name: Build
        run: dotnet build Qplayer.sln --configuration Debug --no-restore

      - name: Set display resolution
        shell: powershell
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force

          Get-CimInstance Win32_VideoController |
            Select-Object CurrentHorizontalResolution, CurrentVerticalResolution

      - name: Prepare recording
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Set-Content artifacts/current-test.txt "Starting tests..."

      - name: Run tests with recording
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $artifacts = "$env:GITHUB_WORKSPACE\artifacts"

          New-Item -ItemType Directory -Force -Path $artifacts | Out-Null

          $recording = "$artifacts\test-feed.mkv"
          $testLabel = "$artifacts\current-test.txt"
          $testLog = "$artifacts\test-output.log"
          $ffmpegLog = "$artifacts\ffmpeg.log"

          Set-Content $testLabel "Starting tests..."
          Set-Content $testLog ""
          Set-Content $ffmpegLog ""

          Write-Host "========================================"
          Write-Host "Starting QPlayer UI test recording"
          Write-Host "========================================"
          Write-Host "Artifacts: $artifacts"
          Write-Host "Recording: $recording"
          Write-Host "Test log:  $testLog"
          Write-Host ""

          #
          # Start FFmpeg
          #

          # 1. Force UTF-8 so FFmpeg can actually read the text
          Set-Content $testLabel "Starting tests..." -Encoding UTF8

          # 2. Escape the Windows paths for FFmpeg's strict filter syntax
          $escapedFontPath = "C\:/Windows/Fonts/arial.ttf"
          $escapedTextPath = $testLabel -replace '\\', '/' -replace ':', '\:'

          # 3. Use the absolute paths in the filter
          $filter = "drawtext=fontfile='$escapedFontPath':textfile='$escapedTextPath':reload=1:fontcolor=white:fontsize=28:box=1:boxcolor=black@0.65:boxborderw=12:x=20:y=h-th-20"

          $ffmpeg = New-Object System.Diagnostics.Process
          $ffmpeg.StartInfo = New-Object System.Diagnostics.ProcessStartInfo

          $ffmpeg.StartInfo.FileName = "ffmpeg"
          $ffmpeg.StartInfo.WorkingDirectory = $artifacts

          $ffmpeg.StartInfo.Arguments = @(
              "-y",
              "-f", "gdigrab",
              "-framerate", "10",
              "-video_size", "1920x1080",
              "-i", "desktop",
              "-vf", $filter,
              "-c:v", "libx264",
              "-preset", "ultrafast",
              "-pix_fmt", "yuv420p",
              $recording
          ) -join " "

          $ffmpeg.StartInfo.UseShellExecute = $false
          $ffmpeg.StartInfo.CreateNoWindow = $true
          $ffmpeg.StartInfo.RedirectStandardInput = $true
          $ffmpeg.StartInfo.RedirectStandardError = $true

          Write-Host "Starting FFmpeg..."
          $ffmpeg.Start() | Out-Null

          Write-Host "FFmpeg started with PID $($ffmpeg.Id)"

          #
          # Drain FFmpeg stderr in the background.
          #
          # This is important: if redirected stderr isn't consumed, FFmpeg
          # can eventually block when its pipe buffer fills.
          #

          $ffmpegErrorTask = $ffmpeg.StandardError.ReadToEndAsync()

          #
          # Start the tests DIRECTLY.
          #
          # Do NOT pipe dotnet test through ForEach-Object.
          #

          $testLog = "$artifacts\test-output.log"

          # 1. Target the solution to match the build step
          # 2. Add --no-build since we already built it
          # 3. Remove the semicolon logger argument
          $testArgs = @(
              "test",
              "Qplayer.sln",
              "--no-build",
              "--configuration",
              "Debug",
              "--",                  # Passes arguments directly to the new Testing Platform
              "--diagnostic"         # Forces the runner to log WHY zero tests were discovered
          )

          # 1. Start a background job to tail the log and update the FFmpeg text file
          $tailJob = Start-Job -ArgumentList $testLog, $testLabel -ScriptBlock {
              param($logPath, $labelPath)
    
              # Wait for the log file to be created by the dotnet process
              while (!(Test-Path $logPath)) { Start-Sleep -Milliseconds 50 }
    
              # Read the log file in real-time
              Get-Content $logPath -Wait | ForEach-Object {
        
                  # Match standard .NET test output (e.g., "Passed Qplayer.Tests.MyTest [15 ms]")
                  if ($_ -match "(Passed|Failed|Skipped)\s+(.*)") {
            
                      # Extract the test name and strip the trailing duration
                      $testName = $matches[2] -replace "\s*\[.*?\]\s*$", ""
            
                      # Force UTF-8 so FFmpeg can read the update
                      Set-Content $labelPath $testName -Encoding UTF8
                  }
                  elseif ($_ -match "Starting test execution") {
                      Set-Content $labelPath "Executing Tests..." -Encoding UTF8
                  }
              }
          }

          Write-Host "========================================"
          Write-Host "Starting tests"
          Write-Host "========================================"
          Write-Host "dotnet $($testArgs -join ' ')"
          Write-Host ""

          # Run dotnet test normally (piping to the log file the job is reading)
          & dotnet @testArgs *> $testLog

          $testExitCode = $LASTEXITCODE

          # 2. Stop and clean up the background tail job
          Stop-Job $tailJob | Out-Null
          Remove-Job $tailJob | Out-Null

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Test process exited: $testExitCode"
          Write-Host "========================================"
          Write-Host ""

          Write-Host "========== TEST OUTPUT =========="

          if (Test-Path $testLog) {
              Get-Content $testLog | ForEach-Object {
                  Write-Host $_
              }
          }

          Write-Host "========== END TEST OUTPUT =========="
          #
          # Stop FFmpeg gracefully.
          #
          Set-Content $testLabel "Tests complete" -Encoding UTF8
          Write-Host ""
          Write-Host "Stopping FFmpeg..."

          Set-Content $testLabel "Tests complete"

          if (!$ffmpeg.HasExited) {

              Write-Host "Sending FFmpeg quit command..."

              $ffmpeg.StandardInput.WriteLine("q")
              $ffmpeg.StandardInput.Flush()

              if (!$ffmpeg.WaitForExit(15000)) {

                  Write-Warning "FFmpeg did not exit within 15 seconds."

                  $ffmpeg.Kill()
                  $ffmpeg.WaitForExit()
              }
          }

          #
          # Finish collecting FFmpeg output.
          #

          $ffmpegError = $ffmpegErrorTask.Result

          if ($ffmpegError) {
              Set-Content -Path $ffmpegLog -Value $ffmpegError
          }

          Write-Host "FFmpeg exited with code $($ffmpeg.ExitCode)"
          Write-Host ""

          #
          # Basic recording diagnostics
          #

          if (Test-Path $recording) {
              $size = (Get-Item $recording).Length

              Write-Host "Recording created:"
              Write-Host "  $recording"
              Write-Host "  Size: $size bytes"
          }
          else {
              Write-Warning "Recording was not created!"
          }

          #
          # Don't hide the actual test result.
          #

          exit $testExitCode

      - name: Convert recording to MP4
        if: always()
        shell: powershell
        run: |
          $input = "$env:GITHUB_WORKSPACE\artifacts\test-feed.mkv"
          $output = "$env:GITHUB_WORKSPACE\artifacts\test-feed.mp4"

          if (Test-Path $input) {
            ffmpeg -y -i "$input" -c copy "$output"
          }

      - name: Upload test recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-recording
          path: artifacts